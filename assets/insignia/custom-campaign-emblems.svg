    <text x="117.5" y="172" text-anchor="middle" class="label">IRON VIPER</text>
    <text x="117.5" y="191" text-anchor="middle" class="sub">Mechanized task force</text>
  </g>

  <!-- 3: Falcon Spear -->
  <g transform="translate(609 120)" filter="url(#shadow)">
    <rect class="panel" width="235" height="200" rx="18"/>
    <g transform="translate(60 18)">
      <path d="M57 5 L108 38 L91 112 L57 140 L23 112 L6 38 Z"
