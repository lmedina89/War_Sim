<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20251f"/>
      <stop offset="1" stop-color="#111411"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1ea"/>
      <stop offset=".45" stop-color="#9ca69c"/>
      <stop offset="1" stop-color="#505950"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1dc86"/>
      <stop offset=".5" stop-color="#b99a3f"/>
      <stop offset="1" stop-color="#6f5920"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".45"/>
    </filter>
    <style>
      .title { font: 700 28px system-ui, sans-serif; fill:#e7e8df; letter-spacing:2px }
      .label { font: 700 17px system-ui, sans-serif; fill:#e7e8df; letter-spacing:1px }
      .sub { font: 13px system-ui, sans-serif; fill:#aab0a7 }
      .panel { fill:#191d19; stroke:#485047; stroke-width:2 }
    </style>
  </defs>

  <rect width="900" height="620" rx="28" fill="url(#bg)"/>
  <text x="45" y="52" class="title">WAR SIM — SVG INSIGNIA TEST SHEET</text>
  <text x="45" y="78" class="sub">Original vector concepts for fictional campaigns and units</text>

  <!-- 1: Northern Shield -->
  <g transform="translate(55 120)" filter="url(#shadow)">
    <rect class="panel" width="235" height="200" rx="18"/>
    <g transform="translate(63 18)">
      <path d="M55 5 L103 22 V70 C103 101 84 124 55 139 C26 124 7 101 7 70 V22 Z"
            fill="#303a2b" stroke="#d2bd68" stroke-width="5"/>
      <path d="M18 87 L42 54 L55 69 L70 44 L94 87 Z" fill="#87947b"/>
      <path d="M59 31 L77 61 H66 L82 91 L58 77 L38 91 L52 61 H42 Z" fill="#d2bd68"/>
      <circle cx="55" cy="31" r="6" fill="#e7e8df"/>
    </g>
    <text x="117.5" y="172" text-anchor="middle" class="label">NORTHERN SHIELD</text>
    <text x="117.5" y="191" text-anchor="middle" class="sub">Campaign emblem</text>
  </g>

  <!-- 2: Iron Viper -->
  <g transform="translate(332 120)" filter="url(#shadow)">
    <rect class="panel" width="235" height="200" rx="18"/>
    <g transform="translate(62 18)">
      <path d="M55 4 L104 29 L96 105 L55 140 L14 105 L6 29 Z"
            fill="#242b26" stroke="#8e9b88" stroke-width="5"/>
      <path d="M28 48 C44 26 75 25 86 43 C95 59 82 73 66 74
               C51 75 43 85 48 99 C53 111 70 111 78 101"
            fill="none" stroke="#b7c2b1" stroke-width="10" stroke-linecap="round"/>
      <path d="M76 38 L93 31 L87 48 Z" fill="#d0b85e"/>
      <circle cx="82" cy="42" r="3.5" fill="#161916"/>
      <path d="M28 108 L83 108" stroke="#d0b85e" stroke-width="5"/>
