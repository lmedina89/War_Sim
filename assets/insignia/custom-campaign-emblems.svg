      <path d="M55 49 C64 63 65 71 55 82 C48 74 48 65 55 49 Z" fill="#dfb95d"/>
      <path d="M23 101 L87 101" stroke="#b9c2b6" stroke-width="6"/>
      <path d="M32 113 L78 113" stroke="#7e897d" stroke-width="4"/>
    </g>
    <text x="117.5" y="172" text-anchor="middle" class="label">EMBER WATCH</text>
    <text x="117.5" y="191" text-anchor="middle" class="sub">Defensive campaign</text>
  </g>

  <!-- 5: Night Anvil -->
  <g transform="translate(332 355)" filter="url(#shadow)">
    <rect class="panel" width="235" height="200" rx="18"/>
    <g transform="translate(62 18)">
      <path d="M55 6 L101 31 L101 90 L55 137 L9 90 L9 31 Z"
            fill="#222522" stroke="#a68c45" stroke-width="5"/>
      <path d="M27 49 H82 L73 62 H64 V80 H81 L91 93 H19 L29 80 H47 V62 H36 Z"
            fill="url(#steel)"/>
      <path d="M55 21 L60 36 L76 36 L63 45 L68 60 L55 51 L42 60 L47 45 L34 36 L50 36 Z"
            fill="#c7ad57"/>
    </g>
    <text x="117.5" y="172" text-anchor="middle" class="label">NIGHT ANVIL</text>
    <text x="117.5" y="191" text-anchor="middle" class="sub">Heavy operations</text>
  </g>

  <!-- 6: Red Horizon -->
  <g transform="translate(609 355)" filter="url(#shadow)">
    <rect class="panel" width="235" height="200" rx="18"/>
    <g transform="translate(62 18)">
      <path d="M55 5 L103 24 V80 C103 108 83 128 55 141 C27 128 7 108 7 80 V24 Z"
            fill="#302927" stroke="#a8aa9f" stroke-width="5"/>
      <circle cx="55" cy="62" r="25" fill="#9f493a"/>
      <path d="M18 86 C35 72 75 72 92 86" fill="none" stroke="#d0b65d" stroke-width="6"/>
      <path d="M18 98 H92" stroke="#727d70" stroke-width="5"/>
      <path d="M55 27 L60 42 L76 42 L63 51 L68 66 L55 57 L42 66 L47 51 L34 42 L50 42 Z"
