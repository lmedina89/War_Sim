    <text x="117.5" y="172" text-anchor="middle" class="label">FALCON SPEAR</text>
    <text x="117.5" y="191" text-anchor="middle" class="sub">Air assault operation</text>
  </g>

  <!-- 4: Ember Watch -->
  <g transform="translate(55 355)" filter="url(#shadow)">
